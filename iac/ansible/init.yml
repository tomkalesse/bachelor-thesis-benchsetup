- name: Initialize metrics collection on all hosts
  hosts: rasdaman_sut
  become: true
  tasks:
    - name: Create metrics directory
      file:
        path: /home/ubuntu/metrics
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy metricscollection scripts to remote
      copy:
        src: ./metricscollection/
        dest: /usr/local/bin/
        mode: '0755'

    - name: Deploy systemd service [CPU]
      copy:
        dest: /etc/systemd/system/vm_metrics_collector_cpu.service
        content: |
          [Unit]
          Description=VM Metrics Collector CPU
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/cpu_metrics.sh
          Restart=on-failure
          User=root

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Deploy systemd service [MEM]
      copy:
        dest: /etc/systemd/system/vm_metrics_collector_mem.service
        content: |
          [Unit]
          Description=VM Metrics Collector MEM
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/mem_metrics.sh
          Restart=on-failure
          User=root

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Deploy systemd service [IO]
      copy:
        dest: /etc/systemd/system/vm_metrics_collector_io.service
        content: |
          [Unit]
          Description=VM Metrics Collector IO
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/io_metrics.sh
          Restart=on-failure
          User=root

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
  
    - name: Deploy systemd service [DISK]
      copy:
        dest: /etc/systemd/system/vm_metrics_collector_disk.service
        content: |
          [Unit]
          Description=VM Metrics Collector DISK
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/disk_metrics.sh
          Restart=on-failure
          User=root

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Deploy systemd service [TCP]
      copy:
        dest: /etc/systemd/system/vm_metrics_collector_tcp.service
        content: |
          [Unit]
          Description=VM Metrics Collector TCP
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/tcp_metrics.sh
          Restart=on-failure
          User=root

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd
      command: systemctl daemon-reload

    - name: Enable and start metrics collector [CPU]
      systemd:
        name: vm_metrics_collector_cpu
        enabled: yes
        state: started

    - name: Enable and start metrics collector [MEM]
      systemd:
        name: vm_metrics_collector_mem
        enabled: yes
        state: started

    - name: Enable and start metrics collector [IO]
      systemd:
        name: vm_metrics_collector_io
        enabled: yes
        state: started
    
    - name: Enable and start metrics collector [DISK]
      systemd:
        name: vm_metrics_collector_disk
        enabled: yes
        state: started

    - name: Enable and start metrics collector [TCP]
      systemd:
        name: vm_metrics_collector_tcp
        enabled: yes
        state: started

- name: Initialize RasDaMan SUT
  hosts: rasdaman_sut
  become: true
  tasks:
    - name: Copy setup scripts to remote
      copy:
        src: ../../rasdaman/sut/
        dest: /home/ubuntu/setup/
        mode: '0755'

    - name: Execute init.sh
      shell: /home/ubuntu/setup/init.sh

    #- name: Execute dwd-import.sh
    #  shell: /setup/dwd-import.sh