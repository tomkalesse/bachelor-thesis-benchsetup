name: dwd_radklim_yw
description: DWD RADKLIM radar-based precipitation climatology
metadata_type: eo

metadata:
  product:
    name: dwd_radklim_yw
    short_name: RADKLIM_YW
    version: '2017.002'
  
  format: 
    name: NetCDF

measurements:
  - name: rainfall_amount
    dtype: float32
    nodata: 999.0
    units: 'kg m-2'
    aliases: ['RR', 'precipitation', 'rainfall']

storage:
  crs: |
    PROJCRS["Stereographic_North_Pole",
    BASEGEOGCRS["GCS_unnamed ellipse",
    DATUM["D_unknown",ELLIPSOID["Unknown",6370040,0,LENGTHUNIT["metre",1]]],
    PRIMEM["Greenwich",0,ANGLEUNIT["Degree",0.0174532925199433]]],
    CONVERSION["unnamed",METHOD["Polar Stereographic (variant B)"],
    PARAMETER["Latitude of standard parallel",60,ANGLEUNIT["Degree",0.0174532925199433]],
    PARAMETER["Longitude of origin",10,ANGLEUNIT["Degree",0.0174532925199433]],
    PARAMETER["False easting",0,LENGTHUNIT["metre",1000]],
    PARAMETER["False northing",0,LENGTHUNIT["metre",1000]]],
    CS[Cartesian,2],
    AXIS["x",south,MERIDIAN[90,ANGLEUNIT["degree",0.0174532925199433]],ORDER[1],LENGTHUNIT["metre",1000]],
    AXIS["y",south,MERIDIAN[180,ANGLEUNIT["degree",0.0174532925199433]],ORDER[2],LENGTHUNIT["metre",1000]]]
  
  resolution:
    x: 1000.0  # 1km resolution in meters
    y: -1000.0 # negative because y increases southward in stereographic
  
  chunking:
    x: 450  # half of x dimension for efficient chunking
    y: 550  # half of y dimension
    time: 1

load:
  crs: |
    PROJCRS["Stereographic_North_Pole",
    BASEGEOGCRS["GCS_unnamed ellipse",
    DATUM["D_unknown",ELLIPSOID["Unknown",6370040,0,LENGTHUNIT["metre",1]]],
    PRIMEM["Greenwich",0,ANGLEUNIT["Degree",0.0174532925199433]]],
    CONVERSION["unnamed",METHOD["Polar Stereographic (variant B)"],
    PARAMETER["Latitude of standard parallel",60,ANGLEUNIT["Degree",0.0174532925199433]],
    PARAMETER["Longitude of origin",10,ANGLEUNIT["Degree",0.0174532925199433]],
    PARAMETER["False easting",0,LENGTHUNIT["metre",1000]],
    PARAMETER["False northing",0,LENGTHUNIT["metre",1000]]],
    CS[Cartesian,2],
    AXIS["x",south,MERIDIAN[90,ANGLEUNIT["degree",0.0174532925199433]],ORDER[1],LENGTHUNIT["metre",1000]],
    AXIS["y",south,MERIDIAN[180,ANGLEUNIT["degree",0.0174532925199433]],ORDER[2],LENGTHUNIT["metre",1000]]]
  
  resolution:
    x: 1000.0
    y: -1000.0
  
  align:
    x: 0
    y: 0